name: Publish Docker Image to GHCR & Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt: building and pushing ghcr.io/garynation/tonys-game:latest..."
            if docker build -t ghcr.io/garynation/tonys-game:latest . && docker push ghcr.io/garynation/tonys-game:latest; then
              echo "Successfully built and pushed ghcr.io/garynation/tonys-game:latest"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          exit 1

      - name: Authenticate to Google Cloud (Optional — runs when GCP_WIF_PROVIDER or GCP_SA_KEY is configured)
        if: ${{ vars.GCP_PROJECT_ID != '' && (vars.GCP_WIF_PROVIDER != '' || secrets.GCP_SA_KEY != '') }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Google Cloud Run (Optional — runs when GCP_PROJECT_ID is configured)
        if: ${{ vars.GCP_PROJECT_ID != '' && (vars.GCP_WIF_PROVIDER != '' || secrets.GCP_SA_KEY != '') }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: galactic-sheep
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'europe-west1' }}
          image: ghcr.io/garynation/tonys-game:latest
          flags: >-
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=256Mi
            --concurrency=80
            --min-instances=0
            --max-instances=2
            --set-env-vars=FIRESTORE_PROJECT=${{ vars.GCP_PROJECT_ID }},USE_FIRESTORE=true
